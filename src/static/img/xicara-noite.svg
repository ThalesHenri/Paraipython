<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" width="120" height="112">
  <!-- Xícara da Edição Noturna no estilo gravura de jornal antigo (desenho original do Expresso PB) -->
  <!-- noite: lua minguante e estrelas no lugar do vapor -->
  <path d="M66 6 A15 15 0 1 0 74 34 A12 12 0 1 1 66 6 Z" fill="#efe4c8" stroke="#1a1815" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#1a1815">
    <path d="M38 12 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z"/>
    <path d="M86 18 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z"/>
    <circle cx="48" cy="32" r="1.4"/><circle cx="90" cy="6" r="1.2"/><circle cx="28" cy="26" r="1"/>
  </g>
  <!-- pires -->
  <ellipse cx="58" cy="94" rx="46" ry="9" fill="#efe4c8" stroke="#1a1815" stroke-width="2.6"/>
  <ellipse cx="58" cy="92" rx="26" ry="4" fill="none" stroke="#1a1815" stroke-width="1.2"/>
  <!-- alça -->
  <path d="M85 56 c15 -3 17 15 -1 19" fill="none" stroke="#1a1815" stroke-width="3"/>
  <!-- corpo -->
  <path d="M28 50 C28 72 38 89 58 89 C78 89 88 72 88 50 Z" fill="#efe4c8" stroke="#1a1815" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- hachuras (sombra da gravura) -->
  <g stroke="#1a1815" stroke-width="1.1" stroke-linecap="round">
    <path d="M80 56 L77 76"/><path d="M76 57 L73 80"/><path d="M72 58 L70 82"/>
    <path d="M84 55 L82 68"/><path d="M36 60 L38 72"/>
  </g>
  <!-- faixa decorativa -->
  <path d="M31 62 C40 66 76 66 85 62" fill="none" stroke="#7a1010" stroke-width="2"/>
  <!-- boca e café com crema -->
  <ellipse cx="58" cy="50" rx="30" ry="6" fill="#efe4c8" stroke="#1a1815" stroke-width="2.6"/>
  <ellipse cx="58" cy="50.5" rx="25" ry="4" fill="#5b3418"/>
  <path d="M42 50 c6 -2 12 1 18 -1 c5 -1 9 1 13 0" fill="none" stroke="#c08a52" stroke-width="1.4" stroke-linecap="round"/>
</svg>
